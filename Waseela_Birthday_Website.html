<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Waseela ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px 15px 40px;
            background: #000;
            color: #fff;
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        h1 {
            margin-top: 20px;
            font-size: 32px;
        }

        p {
            color: #ddd;
            font-size: 18px;
        }

        .gallery {
            max-width: 500px;
            margin: 25px auto;
        }

        img {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 14px auto;
            border-radius: 18px;
            object-fit: cover;
            box-shadow: 0 8px 30px rgba(255, 255, 255, 0.08);
        }

        audio {
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
        }

</head>

<body>

    <h1>Happy Birthday Waseela! 🎂❤️</h1>
    <p>5 Years of Love</p>

    <div class="gallery">
        <img src="image_0.png" alt="Memory 1">
        <img src="image_1.png" alt="Memory 2">
        <img src="image_24.png" alt="Memory 3">
    </div>

    <audio controls autoplay loop>
        <source src="music.mov" type="audio/quicktime">

    </audio>

</html>
